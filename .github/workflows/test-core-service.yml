name: Core Service Tests

on:
  push:
    branches: [master, main, develop]
    paths:
      - 'apps/core-service/**'
      - '.github/workflows/test-core-service.yml'
  pull_request:
    branches: [master, main, develop]
    paths:
      - 'apps/core-service/**'
  workflow_dispatch:   # Allow manual trigger from the Actions tab

jobs:

  # ── Job 1: Unit tests ──────────────────────────────────────────────────────
  # Always runs. No LLM keys needed. Fast (~30s).
  # Blocks merge if any unit test fails.
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ./apps/core-service

      - name: Run unit + evaluation tests
        run: npm run test:run
        working-directory: ./apps/core-service

      - name: Generate coverage report (enforces thresholds)
        run: npm run test:coverage
        working-directory: ./apps/core-service
        # Coverage failures ARE blocking — thresholds configured in vitest.config.ts

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: apps/core-service/coverage/
          retention-days: 14

  # ── Job 2: Benchmarks ──────────────────────────────────────────────────────
  # Always runs. Records timing data as a CI artifact so you can spot
  # regressions by comparing across runs in the Actions UI.
  # Does NOT fail CI — it's informational only.
  benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: unit-tests   # Only run if unit tests pass
    env:
      HUSKY: '0'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ./apps/core-service

      - name: Run benchmarks
        run: npm run bench:run
        working-directory: ./apps/core-service

      - name: Save benchmark results
        run: npm run bench:report
        working-directory: ./apps/core-service
        continue-on-error: true

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results-${{ github.sha }}
          path: apps/core-service/tests/benchmark/results.json
          retention-days: 90   # Keep 3 months of results for trend analysis

  # ── Job 3: Secret presence check ──────────────────────────────────────────
  # Secrets are not accessible in job-level `if` conditions in GHA.
  # This job exposes secret presence as a step output so Job 4 can reference
  # it via the `needs` context (which IS allowed in job `if`).
  check-secrets:
    name: Check LLM API Keys
    runs-on: ubuntu-latest
    needs: unit-tests
    env:
      HUSKY: '0'
    outputs:
      has_llm_key: ${{ steps.check.outputs.has_llm_key }}
    steps:
      - id: check
        name: Detect configured API keys
        run: |
          if [ -n "$OPENAI_API_KEY" ] || [ -n "$ANTHROPIC_API_KEY" ] || [ -n "$GOOGLE_API_KEY" ]; then
            echo "has_llm_key=true" >> $GITHUB_OUTPUT
          else
            echo "has_llm_key=false" >> $GITHUB_OUTPUT
          fi
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

  # ── Job 4: Integration tests ───────────────────────────────────────────────
  # Runs only when at least one LLM API key secret is configured.
  # Uses the real LLM to validate end-to-end fact extraction.
  # Skipped silently when no keys present — does NOT block PRs.
  #
  # To enable: add any of these in GitHub → Settings → Secrets → Actions:
  #   OPENAI_API_KEY      (uses claude-sonnet-4-5 by default → switch to gpt-4 if preferred)
  #   ANTHROPIC_API_KEY
  #   GOOGLE_API_KEY
  integration-tests:
    name: Integration Tests (live LLM)
    runs-on: ubuntu-latest
    needs: [unit-tests, check-secrets]
    env:
      HUSKY: '0'
    if: needs.check-secrets.outputs.has_llm_key == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ./apps/core-service

      - name: Run integration tests
        run: npm run test:integration
        working-directory: ./apps/core-service
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Run evaluation quality gates (live LLM)
        # Re-runs the eval suite WITH the API key so the quality gate sections execute
        run: npm run test:eval
        working-directory: ./apps/core-service
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
